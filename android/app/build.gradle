apply plugin: 'com.android.application'

// Budujemy wylacznie wariant developerski (assembleDebug): paczka jest gotowa
// od razu po sklonowaniu repozytorium, bez zadnej konfiguracji trzymanej poza
// nim. Skrypt scripts/build-android.ps1 wrzuca gotowy plik do dist\android.

android {
    namespace "pl.openiptv.player"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pl.openiptv.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 77
        versionName "3.0.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        /* Silnik VLC (libVLC) wchodzi do paczki tylko dla architektur telewizorów
           — patrz libvlcAbiFilters w variables.gradle. Bez tego filtra paczka
           rosłaby o biblioteki dla emulatorów (x86). */
        ndk {
            for (abi in rootProject.ext.libvlcAbiFilters) {
                abiFilters abi
            }
        }
        buildFeatures {
            buildConfig true
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        /* Biblioteki VLC trzymamy w paczce spakowane. Nieskompresowane zajmują
           w pliku do pobrania ponad 90 MB (obie architektury telewizorów),
           a spakowane około połowy tego; instalator rozpakowuje je przy
           instalacji (patrz CHANGELOG 2.1.9). */
        jniLibs {
            useLegacyPackaging true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    /* Odtwarzacz systemowy (ExoPlayer): kanał TS/HLS idzie nim prosto do
       sprzętowego dekodera, bez rozbierania strumienia w JavaScripcie (patrz
       MainActivity -> ODTWARZACZ NATYWNY oraz app.js -> startExoSource).
       media3-exoplayer-hls jest potrzebny dla kanałów nadawanych jako playlista
       (.m3u8) — bez niego taka playlista kończy się błędem „nieobsługiwany typ”. */
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    /* Silnik VLC (libvlc-android) — trzecia droga obrazu, włączana ręcznie
       przełącznikiem „Odtwarzacz VLC (beta)”: własny demukser TS/HLS i własna
       droga klatek do dekodera sprzętowego (patrz VlcEngine.java). Biblioteki
       wchodzą do paczki tylko dla ABI telewizorów (patrz defaultConfig -> ndk). */
    implementation "org.videolan.android:libvlc-all:$libvlcVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
